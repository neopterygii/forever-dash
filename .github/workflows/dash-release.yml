name: forever-dash addon release

# Republishes an upstream Polestar release with our overlay (overlay/build.py: verified upstream
# zips, patches checked against their base hashes, Polestar_DashSnapshot added, every TOC at
# <x.y.z>.<n>) as release v<x.y.z>.<n> of this fork, with the asset names Polestar Client looks for
# (Polestar-*, Polestar_Recorder-*, SHA256SUMS). The fork's client installs only from here.
#
# Which upstream release: overlay/upstream.txt, which Renovate bumps when upstream publishes one
# (renovate.json).
# - push to dash changing it or the overlay: publishes the next build (n + 1; n = 1 for a new
#   upstream version).
# - push to a renovate/ branch: the same build without publishing, as Renovate's check before it
#   merges the bump into dash.
# - by hand (workflow_dispatch): publishes if this upstream version has no build yet; `rebuild`
#   makes the next n anyway.
on:
  push:
    branches: [dash, "renovate/**"]
    paths: ["overlay/**", "services/dash/addon-test/**", ".github/workflows/dash-release.yml"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Publish a new build (next n) even if this upstream release is built already"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dash-release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Snapshot addon tests
        run: lua5.1 services/dash/addon-test/snapshot_test.lua && lua5.1 services/dash/addon-test/people_test.lua

      - name: Which release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild || 'false' }}
        run: |
          base="$(sed -n 's/^version:[[:space:]]*//p' overlay/upstream.txt)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::overlay/upstream.txt has no version"; exit 1; }
          have="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | .tag_name | select(startswith(\"v${base}.\")) | ltrimstr(\"v${base}.\") | tonumber] | max // 0")"
          if [ "$EVENT" = workflow_dispatch ] && [ "$have" -gt 0 ] && [ "$REBUILD" != "true" ]; then
            echo "v${base}.${have} is out already; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$((have + 1))
          publish=true
          [ "$GITHUB_REF_NAME" = dash ] || publish=false
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building v${base}.${n} (publish: $publish)"

      - name: Upstream zips
        if: steps.which.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.which.outputs.base }}
        run: |
          mkdir upstream
          gh release download "v$BASE" -R fitzforge/polestar -D upstream -p "Polestar-$BASE.zip" -p "Polestar_Recorder-$BASE.zip" -p SHA256SUMS
          # GitHub's own digests too, as Polestar Client checks them.
          gh api "repos/fitzforge/polestar/releases/tags/v$BASE" --jq '.assets[] | select(.digest != null) | "\(.digest | ltrimstr("sha256:"))  \(.name)"' > upstream/github-digests
          (cd upstream && sha256sum -c SHA256SUMS && grep -E ' (Polestar|Polestar_Recorder)-' github-digests | sha256sum -c -)

      - name: Overlay build
        if: steps.which.outputs.skip != 'true'
        run: python3 overlay/build.py upstream "${{ steps.which.outputs.n }}" out

      - name: Publish
        if: steps.which.outputs.skip != 'true' && steps.which.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.which.outputs.base }}
          N: ${{ steps.which.outputs.n }}
        run: |
          tag="v$BASE.$N"
          cat > notes.md <<EOF
          Polestar $BASE (upstream's release, unchanged apart from the TOC versions) with forever-dash's
          Polestar_DashSnapshot addon, build $N. Installed and updated by Forever Dash Client.
          Upstream: https://github.com/fitzforge/polestar/releases/tag/v$BASE
          EOF
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Polestar $BASE + forever-dash $N" --notes-file notes.md --latest=false
