# The forever-dash server image (services/dash/Dockerfile) on GHCR, for the Unraid container.
# Tags: latest, the commit, and polestar-<addon release> (overlay/upstream.txt): the server's parser has to
# match the Recorder of the addon the client installs, so a host can stay on the image of its addon.
name: forever-dash server image
on:
  push:
    branches: [dash]
    paths: [services/dash/**, rust/crates/polestar-recording/**, tools/planner/**, tools/media/**, tools/lib/**, overlay/upstream.txt, .github/workflows/dash-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: dash-image, cancel-in-progress: true }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: addon
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' overlay/upstream.txt | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/dash/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forever-dash-server:latest
            ghcr.io/${{ github.repository_owner }}/forever-dash-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forever-dash-server:polestar-${{ steps.addon.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
