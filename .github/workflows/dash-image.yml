# The forever-dash server image (services/dash/Dockerfile) on GHCR, for the Unraid container.
name: forever-dash server image
on:
  push:
    branches: [dash]
    paths: [services/dash/**, rust/crates/polestar-recording/**, tools/planner/**, tools/media/**, tools/lib/**, .github/workflows/dash-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: dash-image, cancel-in-progress: true }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/dash/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forever-dash-server:latest
            ghcr.io/${{ github.repository_owner }}/forever-dash-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
