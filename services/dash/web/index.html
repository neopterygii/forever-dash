<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Dash</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<!-- Polestar's planner tokens and base styles, so MapView and the page share one look. -->
<link rel="stylesheet" href="/planner/style.css">
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<div id="d-app">
	<aside id="d-side">
		<header id="d-brand"><img src="/brand/wordmark.svg" alt="Forever Dash"></header>
		<ul id="d-chars"></ul>
		<footer id="d-stats"></footer>
	</aside>
	<main id="d-main">
		<nav id="d-tabs">
			<button data-tab="map" class="on">Map</button>
			<button data-tab="journal">Journal</button>
			<span id="d-who"></span>
		</nav>
		<section id="d-map" class="d-pane on">
			<canvas id="d-canvas"></canvas>
			<div id="d-legend"></div>
			<div id="d-info" hidden></div>
			<div id="d-player">
				<select id="d-buffer" aria-label="How much playtime to show"></select>
				<button id="d-play" aria-label="Play"><img src="/glyph/play.png" alt=""></button>
				<div id="d-scrub">
					<input id="d-time" type="range" min="0" max="1000" value="1000" aria-label="Time (playtime; offline gaps skipped)">
					<div id="d-ticks"></div>
				</div>
				<time id="d-clock"></time>
				<select id="d-speed" aria-label="Speed"><option value="30">30×</option><option value="120" selected>120×</option><option value="600">600×</option></select>
			</div>
			<div id="d-nomap" hidden>WebGL2 is not available in this browser.</div>
		</section>
		<section id="d-journal" class="d-pane"></section>
	</main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
