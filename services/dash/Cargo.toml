# forever-dash: the self-hosted dashboard server (map, trails, journal, characters).
# A standalone Cargo project like services/ingest: it builds polestar-recording by path, so the
# parser always matches the Recorder this fork ships.
[package]
name = "forever-dash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.87"
publish = false

[workspace]
members = [".", "proto"]

[dependencies]
polestar-recording = { path = "../../rust/crates/polestar-recording" }
forever-dash-proto = { path = "proto" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
